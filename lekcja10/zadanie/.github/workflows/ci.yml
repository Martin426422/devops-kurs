name: Backup Tool CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x backup.sh tests/test_backup.sh

      - name: Run tests
        run: ./tests/test_backup.sh
